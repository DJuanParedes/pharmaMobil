name: Sesion 14 - Archivo iOS
on:
  push:
    branches: [feature/builds-14]
    paths: ['iosApp/**', 'ci/sesion14/ExportOptions.plist', '.github/workflows/sesion14-ios.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Entorno y esquemas
        run: |
          mkdir -p evidencias-ios build-ios; chmod +x gradlew
          { sw_vers; xcodebuild -version; } > evidencias-ios/entorno.txt
          xcodebuild -list -project iosApp/iosApp.xcodeproj > evidencias-ios/esquemas.txt 2>&1
          xcodebuild -showBuildSettings -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release 2>/dev/null \
            | grep -E ' (PRODUCT_BUNDLE_IDENTIFIER|MARKETING_VERSION|CURRENT_PROJECT_VERSION|DEVELOPMENT_TEAM|CODE_SIGN_STYLE|CODE_SIGN_IDENTITY) =' > evidencias-ios/ajustes-firma.txt
          cat evidencias-ios/ajustes-firma.txt
      - name: Paso 6.1 - firma con la configuración del proyecto (sin cuenta de Apple en el runner)
        run: |
          xcodebuild archive -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build-ios/intento-firmado.xcarchive" \
            -allowProvisioningUpdates > evidencias-ios/intento-con-firma.txt 2>&1 && c=0 || c=$?; echo "codigo=$c" >> evidencias-ios/intento-con-firma.txt
          grep -E 'error:|requires a development team|No Accounts|No profiles' evidencias-ios/intento-con-firma.txt | sort -u | head -10 || true
      - name: Paso 6.2-6.3 - Product > Archive para Any iOS Device
        run: |
          xcodebuild archive -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build-ios/Equipo2_ProyectoFinal_iOS.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > evidencias-ios/archive.txt 2>&1 && codigo=0 || codigo=$?; echo "codigo=$codigo" > evidencias-ios/resultado-archive.txt; tail -5 evidencias-ios/archive.txt; exit $codigo
      - name: Paso 6.4 - distribuir/exportar el .ipa (documenta el limite)
        if: always()
        run: |
          xcodebuild -exportArchive -archivePath "$PWD/build-ios/Equipo2_ProyectoFinal_iOS.xcarchive" \
            -exportOptionsPlist ci/sesion14/ExportOptions.plist -exportPath "$PWD/build-ios/export" \
            -allowProvisioningUpdates > evidencias-ios/exportar-ipa.txt 2>&1 && c=0 || c=$?; echo "codigo=$c" >> evidencias-ios/exportar-ipa.txt
          grep -E 'error|No Accounts|No signing|requires' evidencias-ios/exportar-ipa.txt | sort -u | head -10 || true
          ls -la build-ios/export > evidencias-ios/export-contenido.txt 2>&1 || echo "sin .ipa exportado" > evidencias-ios/export-contenido.txt
      - name: Paso 6.5 - inspeccionar el archivo generado
        if: always()
        run: |
          A=build-ios/Equipo2_ProyectoFinal_iOS.xcarchive
          APP=$(find "$A/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          { echo "Archivo: $A"; plutil -p "$A/Info.plist"; echo; echo "App: $APP"
            plutil -p "$APP/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|CFBundleDisplayName|CFBundleName|MinimumOSVersion'
            echo; lipo -info "$APP/$(basename "$APP" .app)"; echo; codesign -dv "$APP" 2>&1 || true
            echo; du -sh "$A"; } > evidencias-ios/archivo-inspeccion.txt 2>&1
          cat evidencias-ios/archivo-inspeccion.txt
          mkdir -p entrega-ios; ditto -c -k --keepParent "$A" entrega-ios/Equipo2_ProyectoFinal_iOS.xcarchive.zip || true
          ls -la entrega-ios | tee -a evidencias-ios/archivo-inspeccion.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sesion14-entrega-ios
          path: |
            entrega-ios/
            evidencias-ios/
          retention-days: 30
      - name: Publicar en la rama evidencias-s14-ios
        if: always()
        run: |
          mkdir -p pub; cp -r evidencias-ios entrega-ios pub/ 2>/dev/null || true
          echo "run=${GITHUB_RUN_ID} commit=${GITHUB_SHA}" > pub/RUN.txt
          cd pub && git init -q && git checkout -q -b evidencias-s14-ios && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "ios s14 run ${GITHUB_RUN_ID} (${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" evidencias-s14-ios
