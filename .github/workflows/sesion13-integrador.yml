name: Sesion 13 - Integrador Android
on:
  push:
    branches: [feature/integrador-13]
    paths: ['shared/**', 'androidApp/**', 'gradle/**', 'ci/sesion13/**', '.github/workflows/sesion13-integrador.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Pruebas comunes, APK y APK de instrumentación
        run: |
          mkdir -p evidencias-ci
          chmod +x gradlew
          ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest --console=plain 2>&1 | tee evidencias-ci/gradle.txt
          test ${PIPESTATUS[0]} -eq 0
      - name: PharmaSoft real con H2
        run: |
          python3 -m venv "$RUNNER_TEMP/s13-python"
          "$RUNNER_TEMP/s13-python/bin/pip" install -q bcrypt
          nohup "$RUNNER_TEMP/s13-python/bin/python" ci/sesion13/backend_s13.py > evidencias-ci/preparacion-backend.txt 2>&1 &
          for i in $(seq 1 150); do curl -sf http://127.0.0.1:8099/listo && break; sleep 3; done
          curl -sf http://127.0.0.1:8099/listo || { cat evidencias-ci/preparacion-backend.txt; tail -50 evidencias-ci/backend.txt; exit 1; }
      - name: Emulador Android, permisos y sincronización
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/sesion13/ejecutar_android_s13.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sesion13-evidencias
          path: |
            evidencias-ci/
            shared/build/test-results/
            shared/build/reports/tests/
          retention-days: 30
