name: Sesion 9 - detener simulador por indicacion del estudiante
on:
  push:
    branches: [feature/expect-actual-paredes]
    paths: [.github/workflows/sesion09-detener-ios.yml]
permissions:
  actions: write
  contents: read
jobs:
  detener:
    runs-on: ubuntu-latest
    steps:
      - name: Detener inmediatamente la ejecucion iOS de esta actividad
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o respuesta.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/DJuanParedes/pharmaMobil/actions/runs/37534478744/force-cancel)
          if [ "$status" = 202 ] || [ "$status" = 409 ]; then
            echo "Ejecucion detenida o ya finalizada. HTTP $status"
          else
            cat respuesta.json
            exit 1
          fi
