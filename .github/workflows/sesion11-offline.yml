name: Sesion 11 - SQLDelight iOS
on:
  push:
    branches: [feature/offline-first-paredes]
    paths: ['shared/**', 'gradle/**', '.github/workflows/sesion11-offline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verificar commonTest con SQLite nativo y compilar framework
        run: |
          chmod +x gradlew
          ./gradlew :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosArm64 --no-configuration-cache --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sesion11-pruebas-ios
          path: |
            shared/build/test-results/
            shared/build/reports/tests/
          retention-days: 30
