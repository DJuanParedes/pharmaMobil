name: Sesion 11 - SQLDelight iOS
on:
  push:
    branches: [feature/offline-first-paredes]
    paths: ['shared/**', 'gradle/**', '.github/workflows/sesion11-offline.yml', 'ci/ios/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: s11-konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Verificar commonTest con SQLite nativo y compilar framework
        run: |
          chmod +x gradlew
          ./gradlew :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosArm64 --no-configuration-cache --console=plain
      - name: Preparar backend aislado y prueba de interfaz iOS
        run: |
          mkdir -p evidencias-ci
          python3 -m venv "$RUNNER_TEMP/s11-python"
          "$RUNNER_TEMP/s11-python/bin/pip" install bcrypt
          "$RUNNER_TEMP/s11-python/bin/python" ci/ios/backend_offline.py > evidencias-ci/preparacion-backend.txt 2>&1 &
          gem install --user-install xcodeproj --no-document
          ruby ci/ios/preparar_offline.rb
          python3 - <<'PY'
          import urllib.request,time
          for i in range(180):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8099/listo',timeout=2);break
              except Exception: time.sleep(2)
          else: raise RuntimeError('Backend de pruebas no disponible')
          PY
      - name: Capturar reapertura offline en iPhone Simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for g in d["devices"].values() for x in g if x["isAvailable"] and x["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcodebuild test -project iosApp/iosApp.xcodeproj -scheme Sesion11 -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$RUNNER_TEMP/S11Derived" -resultBundlePath "$RUNNER_TEMP/S11.xcresult" CODE_SIGNING_ALLOWED=NO > evidencias-ci/xcode.txt 2>&1 || { tail -80 evidencias-ci/xcode.txt; exit 1; }
      - name: Exportar capturas reales
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/S11.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/S11.xcresult" --output-path evidencias-ci/capturas
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sesion11-pruebas-ios
          path: |
            evidencias-ci/
            shared/build/test-results/
            shared/build/reports/tests/
          retention-days: 30
